<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kargo Durum Formu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Renkli ve göze hitap eden arka plan */
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Şeffaf (Glassmorphism) kart tasarımı */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: none;
        }

        .form-label {
            font-weight: 600;
            color: #4a5568;
        }

        /* Sayı kutularının sağındaki scroll (spin) oklarını gizleme */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield; /* Firefox için okları gizleme */
        }

        .btn-custom {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            transition: transform 0.2s;
        }

        .btn-custom:hover {
            transform: translateY(-2px);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-9 col-lg-8">
                <div class="card p-5">
                    <h2 class="text-center mb-4" style="color: #2d3748; font-weight: 800;">Kargo Durum Formu</h2>

                    <form id="predictionForm">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Depo Bloğu</label>
                                <select class="form-select" id="Warehouse_block" required>
                                    <option value="" selected disabled>Seçiniz...</option>
                                    <option value="A">Blok A</option>
                                    <option value="B">Blok B</option>
                                    <option value="C">Blok C</option>
                                    <option value="D">Blok D</option>
                                    <option value="F">Blok F</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Taşıma Modu</label>
                                <select class="form-select" id="Mode_of_Shipment" required>
                                    <option value="" selected disabled>Seçiniz...</option>
                                    <option value="Flight">Uçak</option>
                                    <option value="Ship">Gemi</option>
                                    <option value="Road">Karayolu</option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Müşteri Hizmetleri Arama Sayısı</label>
                                <input type="number" class="form-control" id="Customer_care_calls" placeholder="Örn: 3" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Müşteri Puanı (1-5)</label>
                                <input type="number" class="form-control" id="Customer_rating" min="1" max="5" placeholder="Örn: 4" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Ürün Maliyeti ($)</label>
                                <input type="number" class="form-control" id="Cost_of_the_Product" placeholder="Örn: 250" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Önceki Sipariş Sayısı</label>
                                <input type="number" class="form-control" id="Prior_purchases" placeholder="Örn: 2" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Ürün Önemi</label>
                                <select class="form-select" id="Product_importance" required>
                                    <option value="" selected disabled>Seçiniz...</option>
                                    <option value="low">Düşük</option>
                                    <option value="medium">Orta</option>
                                    <option value="high">Yüksek</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Müşteri Cinsiyeti</label>
                                <select class="form-select" id="Gender" required>
                                    <option value="" selected disabled>Seçiniz...</option>
                                    <option value="F">Kadın</option>
                                    <option value="M">Erkek</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Uygulanan İndirim (%)</label>
                                <input type="number" class="form-control" id="Discount_offered" placeholder="Örn: 5" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Kargo Ağırlığı (Gram)</label>
                            <input type="number" class="form-control" id="Weight_in_gms" placeholder="Örn: 1500" required>
                        </div>

                        <button type="submit" class="btn btn-custom w-100 py-3 fs-5">Teslimat Durumunu Tahmin Et</button>
                    </form>

                    <div id="resultBox" class="mt-4 text-center p-3 shadow-sm" style="display: none; border-radius: 12px; font-weight: bold; font-size: 1.3rem;">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Tüm veriler Pydantic modelindeki büyük/küçük harf yapısına tam uyumlu olarak çekiliyor
            const data = {
                Warehouse_block: document.getElementById('Warehouse_block').value,
                Mode_of_Shipment: document.getElementById('Mode_of_Shipment').value,
                Customer_care_calls: parseInt(document.getElementById('Customer_care_calls').value),
                Customer_rating: parseInt(document.getElementById('Customer_rating').value),
                Cost_of_the_Product: parseInt(document.getElementById('Cost_of_the_Product').value),
                Prior_purchases: parseInt(document.getElementById('Prior_purchases').value),
                Product_importance: document.getElementById('Product_importance').value,
                Gender: document.getElementById('Gender').value,
                Discount_offered: parseInt(document.getElementById('Discount_offered').value),
                Weight_in_gms: parseInt(document.getElementById('Weight_in_gms').value)
            };

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    throw new Error("Sunucudan geçerli bir yanıt alınamadı. Veri formatını kontrol edin.");
                }

                const result = await response.json();
                const resultBox = document.getElementById('resultBox');
                resultBox.style.display = 'block';

                if(result.prediction === 1) {
                    resultBox.style.backgroundColor = '#ffe5e5';
                    resultBox.style.color = '#d63031';
                    resultBox.style.border = '2px solid #ff7675';
                    resultBox.innerHTML = "⚠️ RİSKLİ: Kargonun Gecikme İhtimali Yüksek!";
                } else {
                    resultBox.style.backgroundColor = '#e8f5e9';
                    resultBox.style.color = '#2e7d32';
                    resultBox.style.border = '2px solid #81c784';
                    resultBox.innerHTML = "✅ SORUNSUZ: Kargo Zamanında Teslim Edilecek.";
                }
            } catch (error) {
                alert("Bir hata oluştu: " + error.message);
            }
        });
    </script>
</body>
</html>
